[project]
name = "colablinter"
version = "0.4.5"
description = "Linting and formatting Python code in Google Colab."
readme = "README.md"
authors = [
    {name = "RektPunk", email = "rektpunk@gmail.com"},
]
keywords = ["jupyter", "colab", "ipython", "magic", "ruff", "isort", "linter"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: IPython",
]
requires-python = ">=3.10"
dependencies = [
    "ipython>=7.34.0",
    "loguru>=0.7.3",
    "ruff>=0.15.20",
]

[project.urls]
repository = "https://github.com/RektPunk/colablinter"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
exclude = ["README.md"]
